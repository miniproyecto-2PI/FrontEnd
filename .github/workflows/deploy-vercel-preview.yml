name: Deploy Vercel preview and check Lighthouse

on:
  push:
    branches:
      - 'feature/**'
      - 'integration/**'

permissions:
  contents: read

concurrency:
  group: vercel-preview-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull preview settings
        run: vercel pull --yes --environment=preview --git-branch="$GIT_BRANCH" --token="$VERCEL_TOKEN"
        env:
          GIT_BRANCH: ${{ github.ref_name }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build preview
        run: vercel build --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy preview
        run: |
          vercel deploy --prebuilt --token="$VERCEL_TOKEN" \
            --meta githubDeployment=1 \
            --meta githubCommitRef="$GIT_BRANCH" > deployment-url.txt
          DEPLOYMENT_URL="$(cat deployment-url.txt)"
          if [[ ! "$DEPLOYMENT_URL" =~ ^https://[a-zA-Z0-9.-]+$ ]]; then
            echo "Vercel did not return a valid deployment URL."
            exit 1
          fi
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "Preview deployed: $DEPLOYMENT_URL"
        id: deploy
        env:
          GIT_BRANCH: ${{ github.ref_name }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Check preview with Lighthouse
        run: >-
          npm exec -- lhci autorun
          --config=.lighthouserc.preview.json
          --collect.url=${{ steps.deploy.outputs.deployment_url }}/
          --collect.url=${{ steps.deploy.outputs.deployment_url }}/base-tecnica
          --collect.numberOfRuns=3

      - name: Save Lighthouse reports
        if: always() && hashFiles('.lighthouseci/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-preview-reports
          path: .lighthouseci
          if-no-files-found: ignore
          retention-days: 14
